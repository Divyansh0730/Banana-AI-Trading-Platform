version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: banana_postgres
    restart: always
    environment:
      POSTGRES_USER: banana_user
      POSTGRES_PASSWORD: banana_password
      POSTGRES_DB: banana_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: banana_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banana_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://banana_user:banana_password@db:5432/banana_trading
      - REDIS_URL=redis://redis:6379/0
      # Add your GEMINI_API_KEY inside the VM or via Settings UI
    depends_on:
      - db
      - redis

  rust-engine:
    build:
      context: ./rust-engine
      dockerfile: Dockerfile
    container_name: banana_rust_engine
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
